server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/meetmind_db?createDatabaseIfNotExist=true&useSSL=false
    username: root
    password: your_mysql_password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: your_email@gmail.com
    password: your_app_password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

openai:
  api:
    key: ${OPENAI_API_KEY:your_openai_api_key_here}

jwt:
  secret: your-super-secret-key-that-is-at-least-32-characters-long
  access-expiration: 3600000
  refresh-expiration: 604800000